name: monkeyssh
description: >
  A mobile SSH workspace for agentic coding with terminal emulation, SFTP,
  MonkeyMux/tmux remote windows, key management, snippets, and port forwarding.
publish_to: 'none'

version: 0.2.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^3.3.2
  
  # Navigation
  go_router: ^17.2.3
  
  # Database
  drift: ^2.34.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  
  # SSH
  dartssh2: ^2.22.0
  
  # Terminal
  # Vendored fork of xterm.dart 4.0.0 (upstream unmaintained since 2024-02).
  # Maintained in third_party/xterm with emulation-core fixes ported from xterm.js.
  xterm:
    path: third_party/xterm
  
  # Syntax highlighting
  highlight: ^0.7.0
  
  # Secure storage
  flutter_secure_storage: ^10.1.0
  
  # Biometrics
  local_auth: ^3.0.2
  
  # File handling
  file_picker: ^12.0.0-beta.7
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.1
  share_plus: ^13.2.0
  cryptography: ^2.9.0
  crypto: ^3.0.6
  pointycastle: ^4.0.0
  
  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  flutter_local_notifications: ^22.0.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.12.0
  
  # Utilities
  uuid: ^4.5.3
  intl: ^0.20.3
  collection: ^1.19.1
  equatable: ^2.1.0
  pasteboard: ^0.5.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.0
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.1
  in_app_purchase_storekit: ^0.4.10+1
  quick_actions: ^1.1.0
  video_player: ^2.12.0
  http: ^1.6.0
  xml: ^7.0.1

  # Network / connectivity
  network_info_plus: ^8.2.0
  permission_handler: ^12.0.1
  wakelock_plus: ^1.5.2
  sqlite3: ^3.4.0
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.3
  firebase_crashlytics: ^5.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  # Pin: the current Flutter SDK caps analyzer at 12.x, so drift_dev is held at
  # 2.34.0 (2.34.1+ needs analyzer ^13). drift_dev 2.34.0 calls
  # DartPlaceholder.when(), which sqlparser removed in 0.44.6, so keep sqlparser
  # at 0.44.5. Remove this pin once a newer Flutter SDK unblocks drift_dev.
  sqlparser: 0.44.5
  
  # Testing
  mocktail: ^1.0.4
  wakelock_plus_platform_interface: ^1.5.0
  integration_test:
    sdk: flutter
  
  # App icons
  flutter_launcher_icons: ^0.14.3

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/monkeymux/
    - assets/monkeymux/bin/darwin-amd64/
    - assets/monkeymux/bin/darwin-arm64/
    - assets/monkeymux/bin/linux-amd64/
    - assets/monkeymux/bin/linux-arm64/
    - assets/monkeymux/bin/windows-amd64/
    - assets/monkeymux/bin/windows-arm64/
    - assets/version_codenames.json
  #   - assets/icons/
  #   - assets/fonts/
