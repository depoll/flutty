name: Sync Store Metadata

on:
  push:
    branches: [main]
    paths:
      - 'assets/icons/**'
      - 'android/fastlane/metadata-*/**'
      - 'ios/fastlane/metadata-*/**'
      - 'ios/fastlane/screenshots/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to sync'
        required: true
        type: choice
        options:
          - both
          - ios
          - android
      app:
        description: 'Which app listing to sync'
        required: true
        type: choice
        options:
          - both
          - private
          - production

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Metadata
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      ios_screenshots: ${{ steps.filter.outputs.ios_screenshots }}
      android: ${{ steps.filter.outputs.android }}
      android_screenshots: ${{ steps.filter.outputs.android_screenshots }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Detect platform metadata changes
        shell: bash
        run: |
          ios=false
          ios_screenshots=false
          android=false
          android_screenshots=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.platform }}" in
              both)
                ios=true
                ios_screenshots=true
                android=true
                android_screenshots=true
                ;;
              ios)
                ios=true
                ios_screenshots=true
                ;;
              android)
                android=true
                android_screenshots=true
                ;;
            esac
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            while IFS= read -r changed_path; do
              case "$changed_path" in
                ios/fastlane/metadata-*|ios/fastlane/metadata-*/*|ios/fastlane/screenshots/*)
                  ios=true
                  ;;
              esac
              case "$changed_path" in
                ios/fastlane/screenshots/*)
                  ios_screenshots=true
                  ;;
              esac
              case "$changed_path" in
                assets/icons/*|android/fastlane/metadata-*|android/fastlane/metadata-*/*)
                  android=true
                  ;;
              esac
              case "$changed_path" in
                android/fastlane/metadata-*/android/*/images/*Screenshots/*)
                  android_screenshots=true
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "ios_screenshots=$ios_screenshots" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "android_screenshots=$android_screenshots" >> "$GITHUB_OUTPUT"

  validate_ios_screenshots:
    name: Validate iOS Store Screenshots
    needs: changes
    if: needs.changes.outputs.ios_screenshots == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install screenshot validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet Pillow

      - name: Validate screenshots with OCR
        run: .venv/bin/python scripts/validate_store_screenshots.py ios

  validate_android_screenshots:
    name: Validate Android Store Screenshots
    needs: changes
    if: needs.changes.outputs.android_screenshots == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install screenshot validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet Pillow

      - name: Validate screenshots with OCR
        run: .venv/bin/python scripts/validate_store_screenshots.py android

  sync-ios:
    name: Sync iOS Metadata
    needs: [changes, validate_ios_screenshots]
    if: >-
      !cancelled() &&
      needs.changes.outputs.ios == 'true' &&
      needs.validate_ios_screenshots.result != 'failure' &&
      needs.validate_ios_screenshots.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate App Store metadata
        run: python3 scripts/validate_app_store_metadata.py ${{ github.event_name == 'push' && 'both' || inputs.app }}

      - name: Sync private app metadata
        if: github.event_name == 'push' || inputs.app == 'both' || inputs.app == 'private'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd ios
          bundle exec fastlane sync_metadata app_identifier:xyz.depollsoft.monkeyssh.private

      - name: Sync production app metadata
        if: github.event_name == 'push' || inputs.app == 'both' || inputs.app == 'production'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd ios
          bundle exec fastlane sync_metadata app_identifier:xyz.depollsoft.monkeyssh

  sync-android:
    name: Sync Android Metadata
    needs: [changes, validate_android_screenshots]
    if: >-
      !cancelled() &&
      needs.changes.outputs.android == 'true' &&
      needs.validate_android_screenshots.result != 'failure' &&
      needs.validate_android_screenshots.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Refresh Play Store icon metadata
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet Pillow
          .venv/bin/python scripts/sync_play_store_icons.py

      - name: Validate Play Store metadata
        run: python3 scripts/validate_play_store_metadata.py ${{ github.event_name == 'push' && 'both' || inputs.app }}

      - name: Sync private app metadata
        if: github.event_name == 'push' || inputs.app == 'both' || inputs.app == 'private'
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd android
          bundle exec fastlane sync_metadata package_name:xyz.depollsoft.monkeyssh.private

      - name: Sync production app metadata
        if: github.event_name == 'push' || inputs.app == 'both' || inputs.app == 'production'
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd android
          bundle exec fastlane sync_metadata package_name:xyz.depollsoft.monkeyssh
