name: Sync Store Metadata

on:
  push:
    branches: [main]
    paths:
      - 'assets/icons/**'
      - 'android/fastlane/metadata-*/**'
      - 'ios/fastlane/metadata-*/**'
      - '.github/workflows/sync-metadata.yml'
      - 'scripts/store_assets.sh'
      - 'scripts/validate_store_screenshots.py'
      - 'scripts/validate_store_demo_videos.py'
      - 'scripts/validate_app_store_metadata.py'
      - 'scripts/validate_play_store_metadata.py'
      - 'scripts/sync_play_store_icons.py'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to sync'
        required: true
        type: choice
        options:
          - both
          - ios
          - android
      app:
        description: 'Which app listing to sync'
        required: true
        type: choice
        options:
          - both
          - private
          - production
  workflow_call:
    inputs:
      platform:
        description: 'Platform to sync'
        required: true
        type: string
      app:
        description: 'Which app listing to sync'
        required: true
        type: string

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Metadata
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      ios_app_previews: ${{ steps.filter.outputs.ios_app_previews }}
      ios_screenshots: ${{ steps.filter.outputs.ios_screenshots }}
      android: ${{ steps.filter.outputs.android }}
      android_screenshots: ${{ steps.filter.outputs.android_screenshots }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Detect platform metadata changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATFORM: ${{ inputs.platform || '' }}
          INPUT_APP: ${{ inputs.app || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          ios=false
          ios_app_previews=false
          ios_screenshots=false
          android=false
          android_screenshots=false
          app='both'

          # workflow_dispatch and reusable workflow_call both provide inputs.*.
          # github.event_name stays the caller's event for workflow_call, so key off
          # the platform input instead of event_name.
          if [[ -n "$INPUT_PLATFORM" ]]; then
            app="${INPUT_APP:-both}"
            case "${INPUT_PLATFORM}" in
              both)
                ios=true
                ios_screenshots=true
                ios_app_previews=true
                android=true
                android_screenshots=true
                ;;
              ios)
                ios=true
                ios_screenshots=true
                ios_app_previews=true
                ;;
              android)
                android=true
                android_screenshots=true
                ;;
              *)
                echo "::error title=Invalid platform::Unsupported platform '${INPUT_PLATFORM}'"
                exit 1
                ;;
            esac
          else
            # Push to main: text metadata / icons changed. Always refresh media from
            # the published store-assets release so screenshots stay in sync.
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
            while IFS= read -r changed_path; do
              case "$changed_path" in
                ios/fastlane/metadata-*|ios/fastlane/metadata-*/*)
                  ios=true
                  ios_screenshots=true
                  ios_app_previews=true
                  ;;
              esac
              case "$changed_path" in
                assets/icons/*|android/fastlane/metadata-*|android/fastlane/metadata-*/*)
                  android=true
                  android_screenshots=true
                  ;;
              esac
              case "$changed_path" in
                scripts/store_assets.sh|scripts/validate_store_screenshots.py|scripts/validate_store_demo_videos.py|.github/workflows/sync-metadata.yml)
                  ios=true
                  ios_screenshots=true
                  ios_app_previews=true
                  android=true
                  android_screenshots=true
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "ios_app_previews=$ios_app_previews" >> "$GITHUB_OUTPUT"
          echo "ios_screenshots=$ios_screenshots" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "android_screenshots=$android_screenshots" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  restore-store-assets:
    name: Restore Store Assets
    needs: changes
    if: >-
      needs.changes.outputs.ios == 'true' ||
      needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download published store assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/store_assets.sh
          scripts/store_assets.sh download

      - name: Upload restored store-assets workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: restored-store-assets
          path: |
            ios/fastlane/screenshots/
            ios/fastlane/app-previews/
            android/fastlane/metadata-private/android/en-US/images/phoneScreenshots/
            android/fastlane/metadata-private/android/en-US/images/sevenInchScreenshots/
            android/fastlane/metadata-private/android/en-US/images/tenInchScreenshots/
            android/fastlane/metadata-production/android/en-US/images/phoneScreenshots/
            android/fastlane/metadata-production/android/en-US/images/sevenInchScreenshots/
            android/fastlane/metadata-production/android/en-US/images/tenInchScreenshots/
            store/demo-videos/
            store-assets-manifest.json
          if-no-files-found: error
          retention-days: 14

  validate_ios_screenshots:
    name: Validate iOS Store Screenshots
    needs: [changes, restore-store-assets]
    if: needs.changes.outputs.ios_screenshots == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download restored store assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restored-store-assets
          path: .

      - name: Install screenshot validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet Pillow

      - name: Validate screenshots with OCR
        run: .venv/bin/python scripts/validate_store_screenshots.py ios

  validate_android_screenshots:
    name: Validate Android Store Screenshots
    needs: [changes, restore-store-assets]
    if: needs.changes.outputs.android_screenshots == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download restored store assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restored-store-assets
          path: .

      - name: Install screenshot validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet Pillow

      - name: Validate screenshots with OCR
        run: .venv/bin/python scripts/validate_store_screenshots.py android

  validate_ios_app_previews:
    name: Validate iOS App Previews
    needs: [changes, restore-store-assets]
    if: needs.changes.outputs.ios_app_previews == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download restored store assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restored-store-assets
          path: .

      - name: Validate App Preview videos
        run: |
          if [ -d ios/fastlane/app-previews ] && \
            find ios/fastlane/app-previews -type f \( -name '*.mov' -o -name '*.mp4' -o -name '*.m4v' \) | grep -q .; then
            python3 scripts/validate_store_demo_videos.py ios
          else
            echo "No iOS App Preview videos present in published store assets; skipping."
          fi

  sync-ios:
    name: Sync iOS Metadata
    needs: [changes, restore-store-assets, validate_ios_screenshots, validate_ios_app_previews]
    if: >-
      !cancelled() &&
      needs.changes.outputs.ios == 'true' &&
      needs.validate_ios_screenshots.result != 'failure' &&
      needs.validate_ios_screenshots.result != 'cancelled' &&
      needs.validate_ios_app_previews.result != 'failure' &&
      needs.validate_ios_app_previews.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download restored store assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restored-store-assets
          path: .

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate App Store metadata
        run: python3 scripts/validate_app_store_metadata.py ${{ needs.changes.outputs.app }}

      - name: Start private App Store metadata GitHub deployment
        id: start-private-ios-metadata-deployment
        if: needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'private'
        continue-on-error: true
        uses: ./.github/actions/deployment-status
        with:
          action: start
          ref: ${{ github.sha }}
          environment: iOS Private / App Store Metadata
          state: in_progress
          description: Syncing private App Store metadata.

      - name: Sync private app metadata
        id: sync-private-ios-metadata
        if: needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'private'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.APP_REVIEW_CONTACT_FIRST_NAME }}
          APP_REVIEW_CONTACT_LAST_NAME: ${{ secrets.APP_REVIEW_CONTACT_LAST_NAME }}
          APP_REVIEW_CONTACT_EMAIL: ${{ secrets.APP_REVIEW_CONTACT_EMAIL }}
          APP_REVIEW_CONTACT_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd ios
          bundle exec fastlane sync_metadata app_identifier:xyz.depollsoft.monkeyssh.private

      - name: Finish private App Store metadata GitHub deployment
        if: always() && (needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'private') && steps.start-private-ios-metadata-deployment.outputs['deployment-id'] != ''
        continue-on-error: true
        uses: ./.github/actions/deployment-status
        with:
          action: finish
          deployment-id: ${{ steps.start-private-ios-metadata-deployment.outputs['deployment-id'] }}
          environment: iOS Private / App Store Metadata
          state: ${{ steps.sync-private-ios-metadata.outcome == 'success' && 'success' || 'failure' }}
          description: ${{ steps.sync-private-ios-metadata.outcome == 'success' && 'Private App Store metadata synced.' || 'Private App Store metadata sync failed.' }}

      - name: Start production App Store metadata GitHub deployment
        id: start-production-ios-metadata-deployment
        if: needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'production'
        continue-on-error: true
        uses: ./.github/actions/deployment-status
        with:
          action: start
          ref: ${{ github.sha }}
          environment: iOS Production / App Store Metadata
          state: in_progress
          description: Syncing production App Store metadata.

      - name: Sync production app metadata
        id: sync-production-ios-metadata
        if: needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'production'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.APP_REVIEW_CONTACT_FIRST_NAME }}
          APP_REVIEW_CONTACT_LAST_NAME: ${{ secrets.APP_REVIEW_CONTACT_LAST_NAME }}
          APP_REVIEW_CONTACT_EMAIL: ${{ secrets.APP_REVIEW_CONTACT_EMAIL }}
          APP_REVIEW_CONTACT_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd ios
          bundle exec fastlane sync_metadata app_identifier:xyz.depollsoft.monkeyssh

      - name: Finish production App Store metadata GitHub deployment
        if: always() && (needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'production') && steps.start-production-ios-metadata-deployment.outputs['deployment-id'] != ''
        continue-on-error: true
        uses: ./.github/actions/deployment-status
        with:
          action: finish
          deployment-id: ${{ steps.start-production-ios-metadata-deployment.outputs['deployment-id'] }}
          environment: iOS Production / App Store Metadata
          state: ${{ steps.sync-production-ios-metadata.outcome == 'success' && 'success' || 'failure' }}
          description: ${{ steps.sync-production-ios-metadata.outcome == 'success' && 'Production App Store metadata synced.' || 'Production App Store metadata sync failed.' }}

  sync-android:
    name: Sync Android Metadata
    needs: [changes, restore-store-assets, validate_android_screenshots]
    if: >-
      !cancelled() &&
      needs.changes.outputs.android == 'true' &&
      needs.validate_android_screenshots.result != 'failure' &&
      needs.validate_android_screenshots.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download restored store assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restored-store-assets
          path: .

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Refresh Play Store icon metadata
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet Pillow
          .venv/bin/python scripts/sync_play_store_icons.py

      - name: Validate Play Store metadata
        run: python3 scripts/validate_play_store_metadata.py ${{ needs.changes.outputs.app }}

      - name: Start private Play Store metadata GitHub deployment
        id: start-private-android-metadata-deployment
        if: needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'private'
        continue-on-error: true
        uses: ./.github/actions/deployment-status
        with:
          action: start
          ref: ${{ github.sha }}
          environment: Android Private / Play Store Metadata
          state: in_progress
          description: Syncing private Play Store metadata.

      - name: Sync private app metadata
        id: sync-private-android-metadata
        if: needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'private'
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd android
          bundle exec fastlane sync_metadata package_name:xyz.depollsoft.monkeyssh.private

      - name: Finish private Play Store metadata GitHub deployment
        if: always() && (needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'private') && steps.start-private-android-metadata-deployment.outputs['deployment-id'] != ''
        continue-on-error: true
        uses: ./.github/actions/deployment-status
        with:
          action: finish
          deployment-id: ${{ steps.start-private-android-metadata-deployment.outputs['deployment-id'] }}
          environment: Android Private / Play Store Metadata
          state: ${{ steps.sync-private-android-metadata.outcome == 'success' && 'success' || 'failure' }}
          description: ${{ steps.sync-private-android-metadata.outcome == 'success' && 'Private Play Store metadata synced.' || 'Private Play Store metadata sync failed.' }}

      - name: Start production Play Store metadata GitHub deployment
        id: start-production-android-metadata-deployment
        if: needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'production'
        continue-on-error: true
        uses: ./.github/actions/deployment-status
        with:
          action: start
          ref: ${{ github.sha }}
          environment: Android Production / Play Store Metadata
          state: in_progress
          description: Syncing production Play Store metadata.
          environment-url: https://play.google.com/store/apps/details?id=xyz.depollsoft.monkeyssh
          production-environment: 'true'

      - name: Sync production app metadata
        id: sync-production-android-metadata
        if: needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'production'
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd android
          bundle exec fastlane sync_metadata package_name:xyz.depollsoft.monkeyssh

      - name: Finish production Play Store metadata GitHub deployment
        if: always() && (needs.changes.outputs.app == 'both' || needs.changes.outputs.app == 'production') && steps.start-production-android-metadata-deployment.outputs['deployment-id'] != ''
        continue-on-error: true
        uses: ./.github/actions/deployment-status
        with:
          action: finish
          deployment-id: ${{ steps.start-production-android-metadata-deployment.outputs['deployment-id'] }}
          environment: Android Production / Play Store Metadata
          state: ${{ steps.sync-production-android-metadata.outcome == 'success' && 'success' || 'failure' }}
          description: ${{ steps.sync-production-android-metadata.outcome == 'success' && 'Production Play Store metadata synced.' || 'Production Play Store metadata sync failed.' }}
          environment-url: https://play.google.com/store/apps/details?id=xyz.depollsoft.monkeyssh
          production-environment: 'true'
